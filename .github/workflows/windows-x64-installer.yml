# Builds the Doc4Me Windows x64 installer (MSI) and portable zip.
# Run it from the Actions tab (workflow_dispatch), by pushing a `v*` tag (also publishes a
# GitHub Release), or by pushing to main. Third-party actions are pinned to commit SHAs.
name: Windows x64 installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A release tag must name the version being built (cargo xtask version set first).
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "tag $($env:GITHUB_REF_NAME) does not match version $version in Cargo.toml"
            exit 1
          }

      - name: Install Rust (MSVC, x64)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install WiX v5 and extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      # Signing is skipped (with a warning) when no signing secrets are configured.
      - name: Build MSI + portable zip
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doc4me-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only CHANGELOG.md is needed (for the release notes).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: doc4me-windows-x64
          path: dist
      # The notes are the tag's "## [X.Y.Z]" section of CHANGELOG.md; without one, GitHub's
      # generated notes.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v head="## [${GITHUB_REF_NAME#v}]" '
              /^## \[/ { if (found) exit; found = (index($0, head) == 1); next }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md has no section for $GITHUB_REF_NAME; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Doc4Me $GITHUB_REF_NAME" "${notes[@]}"
