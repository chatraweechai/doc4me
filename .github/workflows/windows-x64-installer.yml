# Builds the WordCraft Windows x64 installer (MSI) and portable zip.
# Run it from the Actions tab (workflow_dispatch), by pushing a `v*` tag (also publishes a
# GitHub Release), or by pushing to the branches listed below.
name: Windows x64 installer

on:
  push:
    branches: [main, ccr-16d2ca37-vikyc1]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC, x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Install WiX v5 and extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      # Signing is skipped (with a warning) when no signing secrets are configured.
      - name: Build MSI + portable zip
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wordcraft-windows-x64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "WordCraft $GITHUB_REF_NAME" --generate-notes
