# Builds the Doc4Me Windows x64 installer (MSI) and portable zip.
# Run it from the Actions tab (workflow_dispatch), by pushing a `v*` tag (also publishes a
# GitHub Release), or by pushing to main. A workflow_dispatch run on main with `release` ticked
# also publishes a Release and creates its tag, v<version in Cargo.toml>, at the built commit
# (for sessions that can't push tags). Third-party actions are pinned to commit SHAs.
name: Windows x64 installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release and tag v<version in Cargo.toml> (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event too, so a push to main doesn't cancel a release started from the Actions tab.
  group: windows-x64-installer-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A release tag must name the version being built (cargo xtask version set first).
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Error "tag $($env:GITHUB_REF_NAME) does not match version $version in Cargo.toml"
            exit 1
          }

      - name: Install Rust (MSVC, x64)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install WiX v5 and extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      # Built without the signing secrets in the environment, so no build script or proc-macro
      # of a dependency can read them; only the packaging step below gets them.
      - name: Build doc4me + doc4me-cli
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64 -BuildOnly

      # Signing is skipped (with a warning) when no signing secrets are configured: a secret
      # that isn't set reads as empty here, and packaging/windows/sign.ps1 treats empty as unset.
      - name: Sign and package MSI + portable zip
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: pwsh packaging/windows/package.ps1 -Arch x64 -SkipBuild

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doc4me-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only CHANGELOG.md (the release notes) and Cargo.toml (the version) are needed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            Cargo.toml
          sparse-checkout-cone-mode: false
      # A tag push releases that tag. A manual run releases main's version as a new tag at the
      # built commit; it stops if that tag already exists, so it never moves or reuses one.
      - name: Choose the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::release from main only (this run is on $GITHUB_REF)"
              exit 1
            fi
            version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::no version in Cargo.toml (got '$version')"
              exit 1
            fi
            tag="v$version"
            # Only a 404 means no such tag: any other failure (auth, rate limit, outage) stops
            # the run rather than releasing onto a tag that may exist elsewhere.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2> "$RUNNER_TEMP/tag.err"; then
              echo "::error::tag $tag already exists; set a new version with cargo xtask version set"
              exit 1
            elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag.err"; then
              echo "::error::could not check for tag $tag: $(cat "$RUNNER_TEMP/tag.err")"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: doc4me-windows-x64
          path: dist
      # The notes are the tag's "## [X.Y.Z]" section of CHANGELOG.md; without one, GitHub's
      # generated notes.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > "$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v head="## [${TAG#v}]" '
              /^## \[/ { if (found) exit; found = (index($0, head) == 1); next }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::CHANGELOG.md has no section for $TAG; using generated notes"
            notes=(--generate-notes)
          fi
          # --target creates a missing tag at the commit built (a tag push already has it there).
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Doc4Me $TAG" "${notes[@]}"
