[package]
name = "doc4me-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Doc4Me rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
doc4me-geom = { workspace = true }
doc4me-doc = { workspace = true }
doc4me-fonts = { workspace = true }
doc4me-layout = { workspace = true }
doc4me-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
