[package]
name = "doc4me-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Doc4Me layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints]
workspace = true

[dependencies]
doc4me-geom = { workspace = true }
doc4me-doc = { workspace = true }
doc4me-fonts = { workspace = true }
doc4me-proof = { workspace = true }
kurbo = { workspace = true }
foldhash = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# Tests check a system font's OpenType script list before relying on it.
skrifa = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32).
js-sys = "0.3"
