[alias]
xtask = "run --package xtask --"

# whisper.cpp (Home › Dictate, through whisper-rs-sys, which passes GGML_* to its CMake build):
# a build for any x86-64 CPU, not just the build machine's (ggml defaults to -march=native, and a
# release built on a CI runner would then stop with "illegal instruction" on older processors).
# SSE 4.2 stays on; AVX and later are left out. Its bindings are generated for each platform by
# bindgen (libclang: the Windows runners have LLVM); the crate's bundled ones are Linux's and don't
# fit Windows' C runtime.
[env]
GGML_NATIVE = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_BMI2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
